---
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@239610499ad65c397d8d90b1a139d041bf28598a # v1
    with:
      soft-launch: false
      # docs/ is generated by tfplugindocs and checked for staleness in ci.yaml;
      # examples/**/import.sh are the one-line snippets tfplugindocs embeds,
      # not scripts; LICENSE files are verbatim upstream text.
      filter-regex-exclude: '(^|/)(vendor|node_modules|\.terraform|\.venv|dist|build|site)/|(^|/)docs/|(^|/)examples/.*/import\.sh$|(^|/)LICENSE(\.md)?$|(^|/)LICENSE-nextdns-go\.md$'
      # Go is linted by the pinned golangci-lint in ci.yaml against the whole
      # module, with this repository's own configuration.
      validate-go: false
      validate-go-modules: false
