version: "2"
run:
  issues-exit-code: 1
linters:
  enable:
    - depguard
    - err113
    - errname
    - errorlint
    - godot
    - gosec
    - misspell
    - revive
    - thelper
    - unconvert
    - whitespace
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: the github.com/pkg/errors is deprecated, use stdlib instead
    errcheck:
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - err113
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
